name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get last 2 commits for comparison
      
      - name: 📊 Get commit stats
        id: commit_stats
        run: |
          ADDITIONS=$(git show --shortstat | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git show --shortstat | grep -oP '\d+(?= deletion)' || echo "0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: 🚀 Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/marbot-academic-bot
            bash update.sh
      
      - name: 📱 Send Success Notification to WhatsApp
        if: success()
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: >
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE SUCCESS ]*\n_${{ github.event.head_commit.message }}_\n\n*[ `#${{ steps.commit_stats.outputs.short_sha }}` by ${{ github.event.head_commit.author.name }} ]* +${{ steps.commit_stats.outputs.additions }} -${{ steps.commit_stats.outputs.deletions }}\nhttps://github.com/${{ github.repository }}/commit/${{ steps.commit_stats.outputs.short_sha }}",
              "linkPreview": false
            }
      
      - name: 📱 Send Failure Notification to WhatsApp
        if: failure()
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: >
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE FAILED ]*\n_${{ github.event.head_commit.message }}_\n\n*[ `#${{ steps.commit_stats.outputs.short_sha }}` by ${{ github.event.head_commit.author.name }} ]* +${{ steps.commit_stats.outputs.additions }} -${{ steps.commit_stats.outputs.deletions }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "linkPreview": false
            }
      
      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo -e "\033[32m✅ Deployment successful!\033[0m"
            echo -e "\033[36m📝 Commit:\033[0m ${{ github.event.head_commit.message }}"
            echo -e "\033[35m👤 Author:\033[0m ${{ github.event.head_commit.author.name }}"
          else
            echo -e "\033[31m❌ Deployment failed!\033[0m"
            echo -e "\033[33m📝 Failed commit:\033[0m ${{ github.event.head_commit.message }}"
          fi