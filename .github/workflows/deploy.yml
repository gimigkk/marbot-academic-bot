name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  prepare:
    name: 📋 Prepare Deployment Info
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      additions: ${{ steps.stats.outputs.additions }}
      deletions: ${{ steps.stats.outputs.deletions }}
      short_sha: ${{ steps.stats.outputs.short_sha }}
      commit_message: ${{ steps.stats.outputs.commit_message }}
      author_name: ${{ steps.stats.outputs.author_name }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 📊 Calculate commit statistics
        id: stats
        run: |
          ADDITIONS=$(git show --shortstat | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git show --shortstat | grep -oP '\d+(?= deletion)' || echo "0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG_RAW='${{ github.event.head_commit.message }}'
          COMMIT_MSG=$(echo "$COMMIT_MSG_RAW" | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g' | sed 's/"/\\"/g' | head -c 150)
          AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
          
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "author_name=$AUTHOR_NAME" >> $GITHUB_OUTPUT

  build:
    name: 🔨 Build Rust Binary
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    continue-on-error: true  # Don't fail the entire workflow if build fails
    outputs:
      build-success: ${{ steps.build-result.outputs.success }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: 📦 Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "marbot-release"
          cache-on-failure: true
      
      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      
      - name: 🏗️ Build release binary
        id: build
        continue-on-error: true
        env:
          SQLX_OFFLINE: true
        run: |
          echo "🔨 Building for x86_64-unknown-linux-gnu..."
          cargo build --release --target x86_64-unknown-linux-gnu
          
          echo "📊 Binary information:"
          ls -lh target/x86_64-unknown-linux-gnu/release/marbot
          file target/x86_64-unknown-linux-gnu/release/marbot
      
      - name: 🔐 Generate SHA256 checksum
        id: checksum
        if: steps.build.outcome == 'success'
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          sha256sum marbot > marbot.sha256
          CHECKSUM=$(cat marbot.sha256 | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "✅ SHA256: $CHECKSUM"
      
      - name: 📦 Upload binary artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: marbot-binary
          path: |
            target/x86_64-unknown-linux-gnu/release/marbot
            target/x86_64-unknown-linux-gnu/release/marbot.sha256
          retention-days: 1
          if-no-files-found: error
      
      - name: 📝 Set build result
        id: build-result
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Build failed - will fallback to VPS build"
          fi

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()  # Run even if build fails
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout code (for Dockerfiles and update script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            update.sh
            Dockerfile
            Dockerfile.prebuilt
          sparse-checkout-cone-mode: false
      
      - name: 🔍 Check build status
        id: build-check
        run: |
          if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
            echo "mode=prebuilt" >> $GITHUB_OUTPUT
            echo "✅ Using prebuilt binary from GitHub Actions"
          else
            echo "mode=vps-build" >> $GITHUB_OUTPUT
            echo "⚠️ GitHub Actions build failed - will build on VPS"
          fi
      
      - name: 📥 Download binary artifact
        if: steps.build-check.outputs.mode == 'prebuilt'
        uses: actions/download-artifact@v4
        with:
          name: marbot-binary
          path: ./binary
      
      - name: 🔐 Verify binary integrity
        if: steps.build-check.outputs.mode == 'prebuilt'
        run: |
          cd binary
          sha256sum -c marbot.sha256
          echo "✅ Binary integrity verified"
      
      - name: 📤 Transfer files to VPS (prebuilt mode)
        if: steps.build-check.outputs.mode == 'prebuilt'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "binary/marbot,binary/marbot.sha256,update.sh,Dockerfile.prebuilt"
          target: "/tmp/marbot-deploy-${{ needs.prepare.outputs.short_sha }}/"
          strip_components: 0
          overwrite: true
      
      - name: 📤 Transfer files to VPS (VPS build mode)
        if: steps.build-check.outputs.mode == 'vps-build'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "update.sh,Dockerfile"
          target: "/tmp/marbot-deploy-${{ needs.prepare.outputs.short_sha }}/"
          strip_components: 0
          overwrite: true
      
      - name: 🚀 Deploy with prebuilt binary
        if: steps.build-check.outputs.mode == 'prebuilt'
        uses: appleboy/ssh-action@v1
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.short_sha }}
          COMMIT_MSG: ${{ needs.prepare.outputs.commit_message }}
          AUTHOR: ${{ needs.prepare.outputs.author_name }}
          ADDITIONS: ${{ needs.prepare.outputs.additions }}
          DELETIONS: ${{ needs.prepare.outputs.deletions }}
          BUILD_MODE: "prebuilt"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: COMMIT_SHA,COMMIT_MSG,AUTHOR,ADDITIONS,DELETIONS,BUILD_MODE
          script: |
            set -e
            
            DEPLOY_DIR="/tmp/marbot-deploy-${COMMIT_SHA}"
            PROJECT_DIR="/opt/marbot-academic-bot"
            
            echo "🔍 Verifying binary integrity on VPS..."
            cd "$DEPLOY_DIR/binary"
            sha256sum -c marbot.sha256 || {
              echo "❌ Binary integrity check failed!"
              exit 1
            }
            echo "✅ Binary integrity verified on VPS"
            
            echo "📦 Preparing binary..."
            chmod +x marbot
            
            echo "🚀 Deploying to project directory..."
            cd "$PROJECT_DIR"
            
            # Move update script
            cp "$DEPLOY_DIR/update.sh" ./update.sh
            chmod +x ./update.sh
            
            # Move Dockerfile.prebuilt
            cp "$DEPLOY_DIR/Dockerfile.prebuilt" ./Dockerfile.prebuilt
            
            # Move verified binary
            mv "$DEPLOY_DIR/binary/marbot" ./marbot-new
            
            # Run update script with environment variables
            export COMMIT_SHA COMMIT_MSG AUTHOR ADDITIONS DELETIONS BUILD_MODE
            bash update.sh
            
            # Cleanup
            rm -rf "$DEPLOY_DIR"
            
            echo "✅ Deployment complete (prebuilt binary)!"
      
      - name: 🚀 Deploy with VPS build (fallback)
        if: steps.build-check.outputs.mode == 'vps-build'
        uses: appleboy/ssh-action@v1
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.short_sha }}
          COMMIT_MSG: ${{ needs.prepare.outputs.commit_message }}
          AUTHOR: ${{ needs.prepare.outputs.author_name }}
          ADDITIONS: ${{ needs.prepare.outputs.additions }}
          DELETIONS: ${{ needs.prepare.outputs.deletions }}
          BUILD_MODE: "vps-build"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: COMMIT_SHA,COMMIT_MSG,AUTHOR,ADDITIONS,DELETIONS,BUILD_MODE
          script: |
            set -e
            
            DEPLOY_DIR="/tmp/marbot-deploy-${COMMIT_SHA}"
            PROJECT_DIR="/opt/marbot-academic-bot"
            
            echo "⚠️ GitHub Actions build failed - building on VPS"
            
            cd "$PROJECT_DIR"
            
            # Move update script
            cp "$DEPLOY_DIR/update.sh" ./update.sh
            chmod +x ./update.sh
            
            # Move Dockerfile (original)
            cp "$DEPLOY_DIR/Dockerfile" ./Dockerfile
            
            # Run update script with environment variables (will build on VPS)
            export COMMIT_SHA COMMIT_MSG AUTHOR ADDITIONS DELETIONS BUILD_MODE
            bash update.sh
            
            # Cleanup
            rm -rf "$DEPLOY_DIR"
            
            echo "✅ Deployment complete (VPS build fallback)!"
      
      - name: ✅ Deployment successful
        run: |
          if [ "${{ steps.build-check.outputs.mode }}" == "prebuilt" ]; then
            echo "✅ Binary built on GitHub Actions (x86_64-unknown-linux-gnu)"
            echo "✅ Binary integrity verified with SHA256"
          else
            echo "⚠️ GitHub Actions build failed"
            echo "✅ Fallback to VPS build successful"
          fi
          echo "✅ Deployment completed successfully"

  notify-success:
    name: 📱 Send Success Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: success()
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE SUCCESS ]*\n_${{ needs.prepare.outputs.commit_message }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\nhttps://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}"
            }

  notify-failure:
    name: 📱 Send Failure Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: failure()
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE FAILED ]*\n_${{ needs.prepare.outputs.commit_message }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\n\n❌ Deployment failed\n🔍 Check logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy, notify-success, notify-failure]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: 📝 Generate deployment report
        run: |
          echo "# 📊 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "## ✅ Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
              echo "🎉 Deployment completed with GitHub Actions build!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** GitHub Actions (optimized)" >> $GITHUB_STEP_SUMMARY
            else
              echo "🎉 Deployment completed with VPS build fallback!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** VPS Fallback (GitHub Actions build failed)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Note:** GitHub Actions build failed but deployment succeeded via VPS build." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Deployment encountered errors." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Commit Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ needs.prepare.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ needs.prepare.outputs.author_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changes** | +${{ needs.prepare.outputs.additions }} / -${{ needs.prepare.outputs.deletions }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | ${{ needs.prepare.outputs.commit_message }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (GitHub) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY