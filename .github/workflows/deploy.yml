name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  # Colors for logging
  COLOR_RESET: '\033[0m'
  COLOR_BOLD: '\033[1m'
  COLOR_RED: '\033[0;31m'
  COLOR_GREEN: '\033[0;32m'
  COLOR_YELLOW: '\033[0;33m'
  COLOR_BLUE: '\033[0;34m'
  COLOR_MAGENTA: '\033[0;35m'
  COLOR_CYAN: '\033[0;36m'

jobs:
  prepare:
    name: 📋 Prepare Deployment Info
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      additions: ${{ steps.stats.outputs.additions }}
      deletions: ${{ steps.stats.outputs.deletions }}
      short_sha: ${{ steps.stats.outputs.short_sha }}
      commit_message: ${{ steps.stats.outputs.commit_message }}
      commit_message_escaped: ${{ steps.stats.outputs.commit_message_escaped }}
      author_name: ${{ steps.stats.outputs.author_name }}
      cargo_lock_hash: ${{ steps.stats.outputs.cargo_lock_hash }}
    
    steps:
      - name: 📥 Checkout code
        run: echo -e "\033[0;36m📥 Checking out code...\033[0m"
        
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 📊 Calculate commit statistics
        id: stats
        run: |
          echo -e "\033[0;36m📊 Calculating commit statistics...\033[0m"
          
          ADDITIONS=$(git show --shortstat | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git show --shortstat | grep -oP '\d+(?= deletion)' || echo "0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Get commit message and handle special characters
          COMMIT_MSG_RAW=$(git log -1 --pretty=%B)
          
          # For display (truncated, basic escaping)
          COMMIT_MSG=$(echo "$COMMIT_MSG_RAW" | head -c 150 | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g' | xargs)
          
          # For JSON/WhatsApp - single line, escape underscores, properly escape quotes/backslashes
          COMMIT_MSG_ESCAPED=$(echo "$COMMIT_MSG_RAW" | head -c 150 | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g' | xargs | sed 's/_/\\_/g' | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          
          AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
          
          # Get Cargo.lock hash for cache key
          if [ -f "backend/Cargo.lock" ]; then
            CARGO_LOCK_HASH=$(sha256sum backend/Cargo.lock | cut -d' ' -f1 | cut -c1-8)
          else
            CARGO_LOCK_HASH="no-lock"
          fi
          
          # Set outputs - use single line for escaped message
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "cargo_lock_hash=$CARGO_LOCK_HASH" >> $GITHUB_OUTPUT
          echo "author_name=$AUTHOR_NAME" >> $GITHUB_OUTPUT
          
          # Regular message with EOF delimiter
          {
            echo "commit_message<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          # Escaped message as SINGLE LINE (no EOF)
          echo "commit_message_escaped=$COMMIT_MSG_ESCAPED" >> $GITHUB_OUTPUT
          
          echo -e "\033[0;32m✅ Statistics calculated:\033[0m"
          echo -e "  \033[1mCommit:\033[0m $SHORT_SHA"
          echo -e "  \033[1mAuthor:\033[0m $AUTHOR_NAME"
          echo -e "  \033[1mChanges:\033[0m +$ADDITIONS / -$DELETIONS"
          echo -e "  \033[1mCargo Lock:\033[0m $CARGO_LOCK_HASH"

  build:
    name: 🔨 Build Rust Binary
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    outputs:
      build-success: ${{ steps.build-result.outputs.success }}
    
    steps:
      - name: 📥 Checkout code
        run: echo -e "\033[0;36m📥 Checking out code...\033[0m"
        
      - uses: actions/checkout@v4
      
      - name: 📦 Restore Cargo cache
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-${{ runner.os }}-${{ needs.prepare.outputs.cargo_lock_hash }}-${{ hashFiles('backend/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ needs.prepare.outputs.cargo_lock_hash }}-
            cargo-${{ runner.os }}-
      
      - name: 📊 Cache status
        run: |
          if [ "${{ steps.cargo-cache.outputs.cache-hit }}" == "true" ]; then
            echo -e "\033[0;32m✅ Cache hit! Build will be faster.\033[0m"
          else
            echo -e "\033[0;33m⚠️  Cache miss. Building from scratch.\033[0m"
          fi
      
      - name: 🏗️ Build release binary in Docker
        id: build
        continue-on-error: true
        working-directory: backend
        run: |
          echo -e "\033[0;36m🔨 Building inside Docker (rust:1.92-slim-bookworm)...\033[0m"
          
          # Create target directory if it doesn't exist
          mkdir -p target
          
          # Build using Docker with mounted cache
          docker run --rm \
            -v $(pwd):/workspace \
            -v ~/.cargo/registry:/usr/local/cargo/registry \
            -v ~/.cargo/git:/usr/local/cargo/git \
            -w /workspace \
            rust:1.92-slim-bookworm \
            bash -c "
              set -e
              echo -e '\033[0;36m📦 Installing build dependencies...\033[0m'
              apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev > /dev/null 2>&1
              
              echo -e '\033[0;36m🔨 Building release binary (with incremental compilation)...\033[0m'
              export CARGO_INCREMENTAL=1
              cargo build --release --color=always
              
              echo -e '\033[0;32m✅ Build complete!\033[0m'
              ls -lh target/release/marbot
            "
          
          echo -e "\033[0;32m📊 Binary information:\033[0m"
          ls -lh target/release/marbot
          file target/release/marbot
          ldd target/release/marbot 2>/dev/null || echo -e "\033[0;33m⚡ Static binary\033[0m"
      
      - name: 🔍 Check if binary exists
        id: binary-check
        working-directory: backend
        run: |
          if [ -f "target/release/marbot" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo -e "\033[0;32m✅ Binary found!\033[0m"
            
            # Get size for logging
            SIZE=$(du -h target/release/marbot | cut -f1)
            echo -e "\033[1mBinary size:\033[0m $SIZE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo -e "\033[0;31m❌ Binary not found!\033[0m"
          fi
      
      - name: 🔐 Generate SHA256 checksum
        id: checksum
        if: steps.binary-check.outputs.exists == 'true'
        working-directory: backend
        run: |
          echo -e "\033[0;36m🔐 Generating SHA256 checksum...\033[0m"
          
          # Fix permissions first (Docker ran as root)
          sudo chown -R $USER:$USER target/release
          
          cd target/release
          sha256sum marbot > marbot.sha256
          CHECKSUM=$(cat marbot.sha256 | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          
          echo -e "\033[0;32m✅ SHA256:\033[0m \033[1m$CHECKSUM\033[0m"
          cat marbot.sha256
      
      - name: 📦 Upload binary artifact
        if: steps.binary-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marbot-binary
          path: |
            backend/target/release/marbot
            backend/target/release/marbot.sha256
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
      
      - name: 📝 Set build result
        id: build-result
        run: |
          if [ "${{ steps.binary-check.outputs.exists }}" == "true" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo -e "\033[0;32m✅ Build succeeded - binary built with Debian Bookworm GLIBC\033[0m"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo -e "\033[0;33m⚠️  Build failed - will fallback to VPS build\033[0m"
          fi

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout full repository
        run: echo -e "\033[0;36m📥 Checking out repository...\033[0m"
        
      - uses: actions/checkout@v4
      
      - name: 🔍 Check build status
        id: build-check
        run: |
          if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
            echo "mode=prebuilt" >> $GITHUB_OUTPUT
            echo -e "\033[0;32m✅ Using prebuilt binary from GitHub Actions\033[0m"
          else
            echo "mode=vps-build" >> $GITHUB_OUTPUT
            echo -e "\033[0;33m⚠️  GitHub Actions build failed - will build on VPS\033[0m"
          fi
      
      - name: 📥 Download binary artifact
        if: steps.build-check.outputs.mode == 'prebuilt'
        uses: actions/download-artifact@v4
        with:
          name: marbot-binary
          path: ./artifact
      
      - name: 📦 Prepare prebuilt deployment package
        if: steps.build-check.outputs.mode == 'prebuilt'
        run: |
          echo -e "\033[0;36m📦 Preparing prebuilt deployment package...\033[0m"
          
          # Create clean deployment structure
          mkdir -p deploy/backend
          
          # Copy binary and checksum
          cp artifact/marbot deploy/backend/
          cp artifact/marbot.sha256 deploy/backend/
          chmod +x deploy/backend/marbot
          
          # Copy required files
          cp -r backend/Dockerfile.prebuilt deploy/backend/
          cp -r backend/migrations deploy/backend/
          cp backend/schedule.json deploy/backend/
          cp update.sh deploy/
          
          # Create deployment marker
          echo "prebuilt" > deploy/DEPLOY_MODE
          
          echo -e "\033[0;32m✅ Prebuilt package ready\033[0m"
          echo -e "\033[1m📊 Package contents:\033[0m"
          du -sh deploy/*
      
      - name: 📦 Prepare VPS build deployment package
        if: steps.build-check.outputs.mode == 'vps-build'
        run: |
          echo -e "\033[0;36m📦 Preparing VPS build deployment package...\033[0m"
          
          # Create clean deployment structure with full source
          mkdir -p deploy
          
          # Copy entire backend for building
          cp -r backend deploy/
          cp update.sh deploy/
          
          # Create deployment marker
          echo "vps-build" > deploy/DEPLOY_MODE
          
          echo -e "\033[0;32m✅ VPS build package ready\033[0m"
          du -sh deploy/*
      
      - name: 🔐 Verify binary integrity (prebuilt only)
        if: steps.build-check.outputs.mode == 'prebuilt'
        run: |
          echo -e "\033[0;36m🔐 Verifying binary integrity...\033[0m"
          
          cd deploy/backend
          sha256sum -c marbot.sha256
          
          echo -e "\033[0;32m✅ Binary integrity verified before transfer\033[0m"
          echo -e "\033[1m🔍 Binary information:\033[0m"
          file marbot
          ldd marbot 2>/dev/null || echo -e "\033[0;33m⚡ Static binary\033[0m"
      
      - name: 🔧 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      
      - name: 📤 Transfer deployment package to VPS (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          command: |
            echo -e "\033[0;36m📤 Transferring deployment package...\033[0m"
            
            # Create tarball for faster transfer
            tar czf deploy.tar.gz -C deploy .
            
            # SCP with connection options
            scp -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=3 \
                -P ${{ secrets.VPS_PORT }} \
                deploy.tar.gz \
                ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/marbot-deploy-${{ needs.prepare.outputs.short_sha }}.tar.gz
            
            echo -e "\033[0;32m✅ Transfer complete\033[0m"
      
      - name: 🚀 Execute deployment on VPS (with retry)
        uses: nick-fields/retry@v3
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.short_sha }}
          COMMIT_MSG: ${{ needs.prepare.outputs.commit_message }}
          AUTHOR: ${{ needs.prepare.outputs.author_name }}
          ADDITIONS: ${{ needs.prepare.outputs.additions }}
          DELETIONS: ${{ needs.prepare.outputs.deletions }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          command: |
            echo -e "\033[0;36m🚀 Executing deployment on VPS...\033[0m"
            
            ssh -i ~/.ssh/deploy_key \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=3 \
                -p ${{ secrets.VPS_PORT }} \
                ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            
            # Colors for VPS output
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[0;33m'
            BLUE='\033[0;34m'
            CYAN='\033[0;36m'
            BOLD='\033[1m'
            NC='\033[0m'
            
            COMMIT_SHA="${{ needs.prepare.outputs.short_sha }}"
            DEPLOY_DIR="/tmp/marbot-deploy-${COMMIT_SHA}"
            PROJECT_DIR="/opt/marbot-academic-bot"
            
            echo -e "${CYAN}📦 Extracting deployment package${NC}"
            mkdir -p "$DEPLOY_DIR"
            tar xzf "/tmp/marbot-deploy-${COMMIT_SHA}.tar.gz" -C "$DEPLOY_DIR"
            rm "/tmp/marbot-deploy-${COMMIT_SHA}.tar.gz"
            
            ls -la "$DEPLOY_DIR"
            
            # Read deployment mode
            DEPLOY_MODE=$(cat "$DEPLOY_DIR/DEPLOY_MODE")
            echo -e "${BOLD}🔧 Deployment mode:${NC} ${DEPLOY_MODE}"
            
            cd "$PROJECT_DIR"
            
            # Copy update script
            cp "$DEPLOY_DIR/update.sh" ./update.sh
            chmod +x ./update.sh
            
            # Copy backend files based on mode
            if [ "$DEPLOY_MODE" = "prebuilt" ]; then
              echo -e "${GREEN}✅ Installing prebuilt binary and files${NC}"
              
              # Verify binary integrity on VPS
              cd "$DEPLOY_DIR/backend"
              echo -e "${CYAN}🔍 Verifying binary integrity on VPS...${NC}"
              sha256sum -c marbot.sha256 || {
                echo -e "${RED}❌ Binary integrity check failed on VPS!${NC}"
                exit 1
              }
              echo -e "${GREEN}✅ Binary integrity verified on VPS${NC}"
              
              echo -e "${BOLD}🔍 Binary information on VPS:${NC}"
              file marbot
              
              cd "$PROJECT_DIR"
              
              # Update backend files
              mkdir -p backend
              cp "$DEPLOY_DIR/backend/marbot" ./backend/marbot-new
              cp "$DEPLOY_DIR/backend/Dockerfile.prebuilt" ./backend/
              cp -r "$DEPLOY_DIR/backend/migrations" ./backend/
              cp "$DEPLOY_DIR/backend/schedule.json" ./backend/
              
              chmod +x ./backend/marbot-new
              
              echo -e "${GREEN}⚡ Prebuilt binary ready for deployment${NC}"
              
            else
              echo -e "${YELLOW}⚠️  Preparing for VPS build${NC}"
              
              # Replace entire backend directory with fresh source
              rm -rf backend
              cp -r "$DEPLOY_DIR/backend" ./backend
              
              echo -e "${YELLOW}📦 Source code ready for VPS build${NC}"
            fi
            
            # Run update script with environment variables
            export COMMIT_SHA="${{ needs.prepare.outputs.short_sha }}"
            export COMMIT_MSG="${{ needs.prepare.outputs.commit_message }}"
            export AUTHOR="${{ needs.prepare.outputs.author_name }}"
            export ADDITIONS="${{ needs.prepare.outputs.additions }}"
            export DELETIONS="${{ needs.prepare.outputs.deletions }}"
            export DEPLOY_MODE
            
            echo -e "${CYAN}🚀 Running update script...${NC}"
            bash update.sh
            
            # Cleanup
            rm -rf "$DEPLOY_DIR"
            
            echo -e "${GREEN}${BOLD}✅ Deployment complete!${NC}"
            ENDSSH
            
            echo -e "\033[0;32m✅ Deployment executed successfully\033[0m"
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f deploy.tar.gz
      
      - name: ✅ Deployment successful
        run: |
          if [ "${{ steps.build-check.outputs.mode }}" == "prebuilt" ]; then
            echo -e "\033[0;32m✅ Binary built inside Docker (rust:1.92-slim-bookworm)\033[0m"
            echo -e "\033[0;32m✅ GLIBC compatibility ensured\033[0m"
            echo -e "\033[0;32m✅ Runtime query validation (no DATABASE_URL needed)\033[0m"
            echo -e "\033[0;32m✅ Binary integrity verified with SHA256\033[0m"
            echo -e "\033[0;32m✅ Deployed prebuilt binary\033[0m"
          else
            echo -e "\033[0;33m⚠️  GitHub Actions build failed\033[0m"
            echo -e "\033[0;32m✅ Full source deployed for VPS build\033[0m"
            echo -e "\033[0;32m✅ VPS will build from source\033[0m"
          fi
          echo -e "\033[0;32m\033[1m✅ Deployment package transferred successfully (with retry)\033[0m"

  notify-success:
    name: 📱 Send Success Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: needs.deploy.result == 'success'
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        run: echo -e "\033[0;36m📤 Sending success notification...\033[0m"
        
      - uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE SUCCESS ]*\n_${{ needs.prepare.outputs.commit_message_escaped }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\nhttps://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}",
              "linkPreview": false
            }

  notify-failure:
    name: 📱 Send Failure Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: needs.deploy.result == 'failure'
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        run: echo -e "\033[0;31m📤 Sending failure notification...\033[0m"
        
      - uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE FAILED ]*\n_${{ needs.prepare.outputs.commit_message_escaped }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\n\n❌ Deployment failed\n🔍 Check logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "linkPreview": false
            }

  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: 📝 Generate deployment report
        run: |
          echo "# 📊 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "## ✅ Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
              echo "🎉 Deployment completed with prebuilt binary!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** GitHub Actions (Docker-built)" >> $GITHUB_STEP_SUMMARY
              echo "**Environment:** rust:1.92-slim-bookworm" >> $GITHUB_STEP_SUMMARY
              echo "**GLIBC:** Compatible with Debian Bookworm" >> $GITHUB_STEP_SUMMARY
              echo "**Query Verification:** Runtime (no DATABASE_URL needed)" >> $GITHUB_STEP_SUMMARY
              echo "**Caching:** Enabled (Cargo registry + target)" >> $GITHUB_STEP_SUMMARY
              echo "**Retry Logic:** Enabled (3 attempts, 20s interval)" >> $GITHUB_STEP_SUMMARY
            else
              echo "🎉 Deployment completed with VPS build fallback!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** VPS Fallback (GitHub Actions build failed)" >> $GITHUB_STEP_SUMMARY
              echo "**Retry Logic:** Enabled (3 attempts, 20s interval)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Note:** GitHub Actions build failed but deployment succeeded via VPS build." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Deployment encountered errors." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Commit Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ needs.prepare.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ needs.prepare.outputs.author_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changes** | +${{ needs.prepare.outputs.additions }} / -${{ needs.prepare.outputs.deletions }} |" >> $GITHUB_STEP_SUMMARY
          
          # Properly escape commit message for markdown table
          COMMIT_MSG_SAFE=$(echo '${{ needs.prepare.outputs.commit_message }}' | sed 's/|/\\|/g' | sed 's/\*/\\*/g')
          echo "| **Message** | ${COMMIT_MSG_SAFE} |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (GitHub) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY