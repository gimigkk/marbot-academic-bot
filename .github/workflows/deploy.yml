name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  prepare:
    name: 📋 Prepare Deployment Info
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      additions: ${{ steps.stats.outputs.additions }}
      deletions: ${{ steps.stats.outputs.deletions }}
      short_sha: ${{ steps.stats.outputs.short_sha }}
      commit_message: ${{ steps.stats.outputs.commit_message }}
      author_name: ${{ steps.stats.outputs.author_name }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: 📊 Calculate commit statistics
        id: stats
        run: |
          ADDITIONS=$(git show --shortstat | grep -oP '\d+(?= insertion)' || echo "0")
          DELETIONS=$(git show --shortstat | grep -oP '\d+(?= deletion)' || echo "0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG_RAW='${{ github.event.head_commit.message }}'
          COMMIT_MSG=$(echo "$COMMIT_MSG_RAW" | tr '\n' ' ' | tr '\r' ' ' | sed 's/  */ /g' | sed 's/"/\\"/g' | head -c 150 | xargs)
          AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
          
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "author_name=$AUTHOR_NAME" >> $GITHUB_OUTPUT

  build:
    name: 🔨 Build Rust Binary
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      build-success: ${{ steps.build-result.outputs.success }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: 🏗️ Build release binary in Docker (online mode)
        id: build
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔨 Building inside Docker (rust:1.92-slim-bookworm) with online mode..."
          echo "📡 Will connect to database for query verification"
          
          # Build using Docker with DATABASE_URL for online query verification
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            -e DATABASE_URL="${DATABASE_URL}" \
            rust:1.92-slim-bookworm \
            bash -c "
              set -e
              echo '📦 Installing build dependencies...'
              apt-get update && apt-get install -y pkg-config libssl-dev
              
              echo '🔨 Building release binary...'
              echo '📡 Connecting to database for sqlx query verification...'
              cargo build --release
              
              echo '✅ Build complete!'
              ls -lh target/release/marbot
            "
          
          echo "📊 Binary information:"
          ls -lh target/release/marbot
          file target/release/marbot
          ldd target/release/marbot || echo "Static binary"
      
      - name: 🔐 Generate SHA256 checksum
        id: checksum
        if: steps.build.outcome == 'success'
        working-directory: backend
        run: |
          cd target/release
          sha256sum marbot > marbot.sha256
          CHECKSUM=$(cat marbot.sha256 | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "✅ SHA256: $CHECKSUM"
          cat marbot.sha256
      
      - name: 📦 Upload binary artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: marbot-binary
          path: |
            backend/target/release/marbot
            backend/target/release/marbot.sha256
          retention-days: 1
          if-no-files-found: error
      
      - name: 📝 Set build result
        id: build-result
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded - binary built with Debian Bookworm GLIBC + online mode"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Build failed - will fallback to VPS build"
          fi

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout full repository
        uses: actions/checkout@v4
      
      - name: 🔍 Check build status
        id: build-check
        run: |
          if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
            echo "mode=prebuilt" >> $GITHUB_OUTPUT
            echo "✅ Using prebuilt binary from GitHub Actions (Docker build with online mode)"
          else
            echo "mode=vps-build" >> $GITHUB_OUTPUT
            echo "⚠️ GitHub Actions build failed - will build on VPS"
          fi
      
      - name: 📥 Download binary artifact
        if: steps.build-check.outputs.mode == 'prebuilt'
        uses: actions/download-artifact@v4
        with:
          name: marbot-binary
          path: ./artifact
      
      - name: 📦 Prepare prebuilt deployment package
        if: steps.build-check.outputs.mode == 'prebuilt'
        run: |
          # Create clean deployment structure
          mkdir -p deploy/backend
          
          # Copy binary and checksum
          cp artifact/marbot deploy/backend/
          cp artifact/marbot.sha256 deploy/backend/
          chmod +x deploy/backend/marbot
          
          # Copy required files
          cp -r backend/Dockerfile.prebuilt deploy/backend/
          cp -r backend/migrations deploy/backend/
          cp backend/schedule.json deploy/backend/
          cp update.sh deploy/
          
          # Create deployment marker
          echo "prebuilt" > deploy/DEPLOY_MODE
          
          echo "✅ Prebuilt package ready"
          echo "📊 Package contents:"
          ls -laR deploy/
      
      - name: 📦 Prepare VPS build deployment package
        if: steps.build-check.outputs.mode == 'vps-build'
        run: |
          # Create clean deployment structure with full source
          mkdir -p deploy
          
          # Copy entire backend for building
          cp -r backend deploy/
          cp update.sh deploy/
          
          # Create deployment marker
          echo "vps-build" > deploy/DEPLOY_MODE
          
          echo "✅ VPS build package ready"
          ls -laR deploy/
      
      - name: 🔐 Verify binary integrity (prebuilt only)
        if: steps.build-check.outputs.mode == 'prebuilt'
        run: |
          cd deploy/backend
          echo "🔍 Verifying SHA256 checksum..."
          sha256sum -c marbot.sha256
          echo "✅ Binary integrity verified before transfer"
          
          echo "🔍 Binary information:"
          file marbot
          ldd marbot || echo "Static binary"
      
      - name: 📤 Transfer deployment package to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/*"
          target: "/tmp/marbot-deploy-${{ needs.prepare.outputs.short_sha }}/"
          strip_components: 1
          overwrite: true
      
      - name: 🚀 Execute deployment on VPS
        uses: appleboy/ssh-action@v1
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.short_sha }}
          COMMIT_MSG: ${{ needs.prepare.outputs.commit_message }}
          AUTHOR: ${{ needs.prepare.outputs.author_name }}
          ADDITIONS: ${{ needs.prepare.outputs.additions }}
          DELETIONS: ${{ needs.prepare.outputs.deletions }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: COMMIT_SHA,COMMIT_MSG,AUTHOR,ADDITIONS,DELETIONS,DATABASE_URL
          script: |
            set -e
            
            DEPLOY_DIR="/tmp/marbot-deploy-${COMMIT_SHA}"
            PROJECT_DIR="/opt/marbot-academic-bot"
            
            echo "📦 Deployment package received"
            ls -la "$DEPLOY_DIR"
            
            # Read deployment mode
            DEPLOY_MODE=$(cat "$DEPLOY_DIR/DEPLOY_MODE")
            echo "🔧 Deployment mode: $DEPLOY_MODE"
            
            cd "$PROJECT_DIR"
            
            # Copy update script
            cp "$DEPLOY_DIR/update.sh" ./update.sh
            chmod +x ./update.sh
            
            # Copy backend files based on mode
            if [ "$DEPLOY_MODE" = "prebuilt" ]; then
              echo "✅ Installing prebuilt binary and files"
              
              # Verify binary integrity on VPS
              cd "$DEPLOY_DIR/backend"
              echo "🔍 Verifying binary integrity on VPS..."
              sha256sum -c marbot.sha256 || {
                echo "❌ Binary integrity check failed on VPS!"
                exit 1
              }
              echo "✅ Binary integrity verified on VPS"
              
              echo "🔍 Binary information on VPS:"
              file marbot
              
              cd "$PROJECT_DIR"
              
              # Update backend files
              mkdir -p backend
              cp "$DEPLOY_DIR/backend/marbot" ./backend/marbot-new
              cp "$DEPLOY_DIR/backend/Dockerfile.prebuilt" ./backend/
              cp -r "$DEPLOY_DIR/backend/migrations" ./backend/
              cp "$DEPLOY_DIR/backend/schedule.json" ./backend/
              
              chmod +x ./backend/marbot-new
              
            else
              echo "⚠️ Preparing for VPS build"
              
              # Replace entire backend directory with fresh source
              rm -rf backend
              cp -r "$DEPLOY_DIR/backend" ./backend
            fi
            
            # Run update script with environment variables
            export COMMIT_SHA COMMIT_MSG AUTHOR ADDITIONS DELETIONS DEPLOY_MODE DATABASE_URL
            bash update.sh
            
            # Cleanup
            rm -rf "$DEPLOY_DIR"
            
            echo "✅ Deployment complete!"
      
      - name: ✅ Deployment successful
        run: |
          if [ "${{ steps.build-check.outputs.mode }}" == "prebuilt" ]; then
            echo "✅ Binary built inside Docker (rust:1.92-slim-bookworm)"
            echo "✅ GLIBC compatibility ensured"
            echo "✅ Online mode - queries verified against database"
            echo "✅ Binary integrity verified with SHA256"
            echo "✅ Deployed prebuilt binary"
          else
            echo "⚠️ GitHub Actions build failed"
            echo "✅ Full source deployed for VPS build"
            echo "✅ VPS will build from source"
          fi
          echo "✅ Deployment package transferred successfully"

  notify-success:
    name: 📱 Send Success Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: needs.deploy.result == 'success'
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE SUCCESS ]*\n_${{ needs.prepare.outputs.commit_message }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\nhttps://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}",
              "linkPreview": false
            }

  notify-failure:
    name: 📱 Send Failure Notification
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: needs.deploy.result == 'failure'
    timeout-minutes: 2
    
    steps:
      - name: 📤 Send WhatsApp notification
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.WAHA_URL }}/api/sendText
          headers: '{"X-Api-Key": "${{ secrets.WAHA_API_KEY }}", "Content-Type": "application/json"}'
          body: |
            {
              "session": "default",
              "chatId": "${{ secrets.DEBUG_GROUP_ID }}",
              "text": "*[ MARBOT UPDATE FAILED ]*\n_${{ needs.prepare.outputs.commit_message }}_\n\n*[ `#${{ needs.prepare.outputs.short_sha }}` by ${{ needs.prepare.outputs.author_name }} ]* +${{ needs.prepare.outputs.additions }} -${{ needs.prepare.outputs.deletions }}\n\n❌ Deployment failed\n🔍 Check logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "linkPreview": false
            }

  summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: 📝 Generate deployment report
        run: |
          echo "# 📊 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "## ✅ Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.build.outputs.build-success }}" == "true" ]; then
              echo "🎉 Deployment completed with prebuilt binary!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** GitHub Actions (Docker-built, online mode)" >> $GITHUB_STEP_SUMMARY
              echo "**Environment:** rust:1.92-slim-bookworm" >> $GITHUB_STEP_SUMMARY
              echo "**GLIBC:** Compatible with Debian Bookworm" >> $GITHUB_STEP_SUMMARY
              echo "**Query Verification:** Online (connected to database)" >> $GITHUB_STEP_SUMMARY
            else
              echo "🎉 Deployment completed with VPS build fallback!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build Method:** VPS Fallback (GitHub Actions build failed)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Note:** GitHub Actions build failed but deployment succeeded via VPS build." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Deployment encountered errors." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Commit Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${{ needs.prepare.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.prepare.outputs.short_sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ needs.prepare.outputs.author_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changes** | +${{ needs.prepare.outputs.additions }} / -${{ needs.prepare.outputs.deletions }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | ${{ needs.prepare.outputs.commit_message }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (GitHub) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY