name: Rust tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marbot_test
          POSTGRES_PASSWORD: fixture_password
          POSTGRES_DB: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marbot_test -d attendance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: 'true'
      ATTENDANCE_TEST_DATABASE_URL: postgres://marbot_test:fixture_password@localhost:5432/attendance_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: rust-test-${{ runner.os }}-1.92-${{ hashFiles('backend/Cargo.lock') }}
      - name: Test including PostgreSQL and local HTTP fixtures
        working-directory: backend
        run: cargo +1.92.0 test --locked -- --include-ignored
