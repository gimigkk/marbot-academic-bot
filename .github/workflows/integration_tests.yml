name: 🧪 Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Number of tests to run (leave empty for all)'
        required: false
        type: string
      concurrency:
        description: 'Test concurrency (1=sequential, higher=parallel)'
        required: false
        default: '1'
        type: string

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  RUST_LOG: info
  TEST_LIMIT: ${{ github.event.inputs.test_limit || '' }}
  TEST_CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
  TEST_DELAY_SECS: "6"
  TEST_MAX_RETRIES: "5"
  TEST_RETRY_DELAY_SECS: "30"

jobs:
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.count_tests.outputs.count }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Validate Environment
        id: validate
        run: |
          echo "## 🔐 Environment Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "✅ GEMINI_API_KEY is set" >> $GITHUB_STEP_SUMMARY
            echo "::notice::GEMINI_API_KEY is configured"
          else
            echo "⚠️ GEMINI_API_KEY is not set" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "✅ GROQ_API_KEY is set" >> $GITHUB_STEP_SUMMARY
            echo "::notice::GROQ_API_KEY is configured"
          else
            echo "⚠️ GROQ_API_KEY is not set" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "❌ ERROR: At least one API key must be configured" >> $GITHUB_STEP_SUMMARY
            echo "::error::No API keys available"
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Environment validation passed" >> $GITHUB_STEP_SUMMARY
      
      - name: 📊 Count Test Cases
        id: count_tests
        run: |
          if [ -f backend/tests/test_cases.json ]; then
            count=$(cat backend/tests/test_cases.json | jq 'length')
            echo "count=$count" >> $GITHUB_OUTPUT
            
            echo "## 📋 Test Configuration" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Test Cases | $count |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests to Run | ${{ github.event.inputs.test_limit || 'All' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Concurrency | ${{ github.event.inputs.concurrency || '1' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Delay Between Tests | 6 seconds |" >> $GITHUB_STEP_SUMMARY
            echo "| **Max Retries (Rate Limits)** | **5 attempts** |" >> $GITHUB_STEP_SUMMARY
            echo "| Retry Delay | 30 seconds |" >> $GITHUB_STEP_SUMMARY
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "::error::test_cases.json not found"
            exit 1
          fi

  test:
    name: 🧪 Run Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 90
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: 💾 Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: 🔧 Install sqlx-cli
        run: |
          if ! command -v sqlx &> /dev/null; then
            echo "::group::Installing sqlx-cli"
            cargo install sqlx-cli --no-default-features --features postgres
            echo "::endgroup::"
          else
            echo "✅ sqlx-cli already installed"
          fi
      
      - name: 🗄️ Run Database Migrations
        run: |
          cd backend
          echo "::group::Running migrations"
          sqlx migrate run
          echo "::endgroup::"
          echo "✅ Database schema initialized"
          echo ""
          echo "📝 Note: Courses will be seeded by the test suite"
          echo "📝 Assignments will be saved as tests classify messages"
      
      - name: 🧪 Execute Tests
        id: run_tests
        run: |
          cd backend
          
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║              🧪 COMPREHENSIVE TEST EXECUTION                   ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║  Features Being Tested:                                        ║"
          echo "║    • Multi-tier AI fallback (Gemini → Groq)                    ║"
          echo "║    • Context builder & schedule oracle                         ║"
          echo "║    • Parallel code extraction                                  ║"
          echo "║    • AI-powered duplicate detection                            ║"
          echo "║    • Quoted message handling                                   ║"
          echo "║    • ⭐ AUTOMATIC RETRY ON RATE LIMITS ⭐                      ║"
          echo "║    • 💾 AUTOMATIC DATABASE PERSISTENCE                         ║"
          echo "║                                                                ║"
          echo "║  Configuration:                                                ║"
          echo "║    • Delay: 6 seconds between tests                            ║"
          echo "║    • Retries: Up to 5 attempts on rate limit                   ║"
          echo "║    • Retry delay: 30 seconds                                   ║"
          echo "║    • Rate limit errors = NOT test failures                     ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          
          cargo test --test integration_tests -- --test-threads=1 --nocapture
        continue-on-error: true
      
      - name: 📤 Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.json
            backend/test-summary.json
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: 📊 Generate Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: 📥 Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: results/
      
      - name: 📊 Generate Beautiful Summary
        run: |
          if [ ! -f results/test-summary.json ]; then
            echo "## ⚠️ Test Results Not Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test execution may have failed before generating results." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          TOTAL=$(cat results/test-summary.json | jq -r '.total')
          PASSED=$(cat results/test-summary.json | jq -r '.passed')
          FAILED=$(cat results/test-summary.json | jq -r '.failed')
          SUCCESS_RATE=$(cat results/test-summary.json | jq -r '.success_rate')
          TOTAL_RETRIES=$(cat results/test-summary.json | jq -r '.total_retries')
          
          if [ "$FAILED" -eq 0 ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All Tests Passed!"
            STATUS_COLOR="🟢"
          elif [ "$FAILED" -lt 5 ]; then
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Some Tests Failed"
            STATUS_COLOR="🟡"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Multiple Failures"
            STATUS_COLOR="🔴"
          fi
          
          echo "# $STATUS_EMOJI Test Results: $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📈 Overall Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| $STATUS_COLOR **Status** | **$STATUS_TEXT** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 **Success Rate** | **${SUCCESS_RATE}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ **Passed** | $PASSED / $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ **Failed** | $FAILED / $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 **Auto-Retries (Rate Limits)** | $TOTAL_RETRIES |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$TOTAL_RETRIES" -gt 0 ]; then
            echo "> 💡 **Note:** $TOTAL_RETRIES tests hit rate limits but were automatically retried and succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "## 📂 Results by Category" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Passed | Failed | Total | Success Rate |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|--------|-------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          cat results/test-summary.json | jq -r '
            .by_category | to_entries[] | 
            "| " + .key + " | " + (.value.passed | tostring) + " | " + 
            (.value.failed | tostring) + " | " + (.value.total | tostring) + 
            " | " + (.value.success_rate | tostring) + "% |"
          ' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED" -gt 0 ]; then
            echo "## ❌ Failed Tests ($FAILED)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            cat results/test-summary.json | jq -r '.failures[] | 
              "### 🔴 " + .name + "\n\n" +
              "**Category:** `" + .category + "`\n\n" +
              "**Expected:** `" + .expected + "`\n\n" +
              "**Got:** `" + .actual + "`\n\n" +
              "**Message Preview:**\n```\n" + .message_preview + "\n```\n\n" +
              (if .error then "**Error:**\n```\n" + .error + "\n```\n\n" else "" end) +
              "---\n"
            ' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Perfect Score!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **All tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$TOTAL_RETRIES" -gt 0 ]; then
              echo "The system automatically handled $TOTAL_RETRIES rate limit(s) by retrying — no manual intervention needed!" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            echo "Your system correctly:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Classified all message types" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Saved assignments to the database" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Handled context and schedules" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Detected duplicates" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Workflow:** [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎨 Display Console Summary
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║                   📊 COMPREHENSIVE SUMMARY                     ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          
          if [ -f results/test-summary.json ]; then
            cat results/test-summary.json | jq -r '
              "  Total Tests:     \(.total)",
              "  ✅ Passed:       \(.passed)",
              "  ❌ Failed:       \(.failed)",
              "  📈 Success Rate: \(.success_rate)%",
              "  🔄 Auto-Retries: \(.total_retries)",
              "",
              if .failed > 0 then
                "╔═══════════════════════════════════════════════════════════════╗\n" +
                "║                       ❌ FAILED TESTS                          ║\n" +
                "╚═══════════════════════════════════════════════════════════════╝\n\n" +
                (.failures | to_entries | map(
                  "  " + ((.key + 1) | tostring) + ". " + .value.name + " [" + .value.category + "]\n" +
                  "     Expected: " + .value.expected + "\n" +
                  "     Got:      " + .value.actual + "\n" +
                  (if .value.error then "     Error:    " + .value.error + "\n" else "" end)
                ) | join("\n"))
              else
                "🎉 All tests passed!\n" +
                (if .total_retries > 0 then 
                  "   ✓ Handled " + (.total_retries | tostring) + " rate limit(s) automatically\n"
                else "" end) +
                "   ✓ Multi-tier AI fallback\n" +
                "   ✓ Database persistence\n" +
                "   ✓ Context & schedules\n" +
                "   ✓ Duplicate detection\n"
              end
            '
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║           📄 Full results saved to test-results.json           ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
      
      - name: ✅ Check Final Status
        run: |
          FAILED=$(cat results/test-summary.json | jq -r '.failed')
          
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          else
            echo "::notice::All tests passed! 🎉"
          fi