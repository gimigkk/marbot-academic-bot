name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Number of tests to run (default: all)'
        required: false
        type: string

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
  WAHA_URL: "http://localhost:3000"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  RUST_LOG: info
  TEST_LIMIT: ${{ github.event.inputs.test_limit || '' }}
  TEST_CONCURRENCY: "1"

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx &> /dev/null; then
            cargo install sqlx-cli --no-default-features --features postgres
          else
            echo "sqlx-cli already installed"
          fi
      
      - name: Run migrations
        run: |
          cd backend
          sqlx migrate run
      
      - name: Verify test setup
        run: |
          cd backend
          echo "=== Checking for test files ==="
          ls -la tests/ || echo "No tests directory"
          echo ""
          echo "=== Test cases count ==="
          if [ -f tests/test_cases.json ]; then
            cat tests/test_cases.json | jq 'length' || echo "Unable to parse test_cases.json"
          else
            echo "No test_cases.json found"
          fi
      
      - name: Run tests
        run: |
          cd backend
          cargo test --test integration_tests -- --test-threads=1 --nocapture
        continue-on-error: true
        id: test_run
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.json
            backend/test-summary.json
          if-no-files-found: warn
      
      - name: Display summary
        if: always()
        run: |
          if [ -f backend/test-summary.json ]; then
            echo "📊 Test Summary"
            cat backend/test-summary.json | jq -r '
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
              "Total: \(.total)",
              "✅ Passed: \(.passed)",
              "❌ Failed: \(.failed)",
              "📈 Success Rate: \(.success_rate)%",
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
              "",
              "📂 By Category:",
              (.by_category | to_entries[] | "  \(.key): \(.value.passed)/\(.value.total) (\(.value.success_rate)%)"),
              "",
              (if .failures | length > 0 then
                "❌ Failed Tests:",
                (.failures[] | "  • \(.name) [\(.category)]", "    Expected: \(.expected), Got: \(.actual)")
              else
                "✅ All tests passed!"
              end)
            '
          else
            echo "⚠️  No test summary found"
          fi
      
      - name: Check test result
        if: always()
        run: |
          if [ "${{ steps.test_run.outcome }}" != "success" ]; then
            echo "❌ Tests failed - check logs above"
            exit 1
          fi