name: Integration Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Number of tests to run (default: all)'
        required: false
        type: string

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
  WAHA_URL: "http://localhost:3000"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  RUST_LOG: info
  TEST_LIMIT: ${{ github.event.inputs.test_limit || '' }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      
      - name: Run migrations
        run: |
          cd backend
          sqlx migrate run
      
      - name: Verify test setup
        run: |
          cd backend
          echo "=== Checking for test files ==="
          ls -la tests/ || echo "No tests directory"
          echo "=== Checking for test cases ==="
          cat tests/test_cases.json || echo "No test_cases.json found"
      
      - name: Run tests
        run: |
          cd backend
          cargo test --test integration_tests -- --test-threads=1 --nocapture 2>&1 | tee test-output.log
        continue-on-error: true
        id: test_run
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.json
            backend/test-output.log
          if-no-files-found: warn
      
      - name: Show test output
        if: always()
        run: |
          if [ -f backend/test-output.log ]; then
            echo "=== Test Output ==="
            cat backend/test-output.log
          fi
          if [ -f backend/test-results.json ]; then
            echo "=== Test Results ==="
            cat backend/test-results.json
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('backend/test-results.json', 'utf8'));
              const passed = results.filter(r => r.passed).length;
              const failed = results.filter(r => !r.passed).length;
              const rate = ((passed / results.length) * 100).toFixed(1);
              
              let comment = `## 🧪 Integration Test Results\n\n`;
              comment += `- ✅ Passed: ${passed}\n`;
              comment += `- ❌ Failed: ${failed}\n`;
              comment += `- 📈 Success Rate: ${rate}%\n\n`;
              
              if (failed > 0) {
                comment += `### Failed Tests\n`;
                results.filter(r => !r.passed).forEach(t => {
                  comment += `- **${t.name}**: Expected \`${t.expected}\`, got \`${t.actual}\`\n`;
                });
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not read test results:', e);
            }