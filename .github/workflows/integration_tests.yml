name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Number of tests to run (default: all)'
        required: false
        type: string

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
  WAHA_URL: "http://localhost:3000"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  RUST_LOG: info
  TEST_LIMIT: ${{ github.event.inputs.test_limit || '' }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx &> /dev/null; then
            cargo install sqlx-cli --no-default-features --features postgres
          else
            echo "sqlx-cli already installed"
          fi
      
      - name: Run migrations
        run: |
          cd backend
          sqlx migrate run
      
      - name: Verify test setup
        run: |
          cd backend
          echo "=== Checking for test files ==="
          ls -la tests/ || echo "No tests directory"
          echo "=== Checking for test cases ==="
          cat tests/test_cases.json || echo "No test_cases.json found"
      
      - name: Run tests
        run: |
          cd backend
          cargo test --test integration_tests -- --test-threads=1 --nocapture 2>&1 | tee test-output.log
        continue-on-error: true
        id: test_run
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.json
            backend/test-summary.json
            backend/test-output.log
          if-no-files-found: warn
      
      - name: Display summary
        if: always()
        run: |
          if [ -f backend/test-summary.json ]; then
            echo "📊 Test Summary"
            cat backend/test-summary.json | jq -r '
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
              "Total: \(.total)",
              "✅ Passed: \(.passed)",
              "❌ Failed: \(.failed)",
              "📈 Success Rate: \(.success_rate)%",
              "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
              "",
              "📂 By Category:",
              (.by_category | to_entries[] | "  \(.key): \(.value.passed)/\(.value.total) (\(.value.success_rate)%)"),
              "",
              (if .failures | length > 0 then
                "❌ Failed Tests:",
                (.failures[] | "  • \(.name) [\(.category)]", "    Expected: \(.expected), Got: \(.actual)")
              else
                "✅ All tests passed!"
              end)
            '
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = JSON.parse(fs.readFileSync('backend/test-summary.json', 'utf8'));
              
              let comment = `## 🧪 Integration Test Results\n\n`;
              comment += `| Metric | Value |\n`;
              comment += `|--------|-------|\n`;
              comment += `| Total Tests | ${summary.total} |\n`;
              comment += `| ✅ Passed | ${summary.passed} |\n`;
              comment += `| ❌ Failed | ${summary.failed} |\n`;
              comment += `| 📈 Success Rate | ${summary.success_rate.toFixed(1)}% |\n\n`;
              
              if (Object.keys(summary.by_category).length > 0) {
                comment += `### 📂 Results by Category\n\n`;
                comment += `| Category | Passed | Total | Rate |\n`;
                comment += `|----------|--------|-------|------|\n`;
                
                Object.entries(summary.by_category)
                  .sort(([a], [b]) => a.localeCompare(b))
                  .forEach(([category, stats]) => {
                    const icon = stats.success_rate === 100 ? '✅' : stats.success_rate >= 80 ? '⚠️' : '❌';
                    comment += `| ${icon} ${category} | ${stats.passed} | ${stats.total} | ${stats.success_rate.toFixed(0)}% |\n`;
                  });
                comment += `\n`;
              }
              
              if (summary.failures.length > 0) {
                comment += `### ❌ Failed Tests\n\n`;
                comment += `<details>\n<summary>Show ${summary.failures.length} failure(s)</summary>\n\n`;
                
                summary.failures.forEach((failure, i) => {
                  comment += `\n**${i + 1}. ${failure.name}** \`[${failure.category}]\`\n`;
                  comment += `- Expected: \`${failure.expected}\`\n`;
                  comment += `- Got: \`${failure.actual}\`\n`;
                  if (failure.error) {
                    comment += `- Error: ${failure.error}\n`;
                  }
                  if (failure.message_preview) {
                    const preview = failure.message_preview.length > 80 
                      ? failure.message_preview.substring(0, 80) + '...'
                      : failure.message_preview;
                    comment += `- Message: \`${preview}\`\n`;
                  }
                });
                
                comment += `\n</details>\n`;
              } else {
                comment += `### ✅ All Tests Passed! 🎉\n`;
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not read test results:', e);
            }