version: '3.8'

services:
  backend:
    # Use the image that was built by update.sh
    # update.sh builds it with the correct Dockerfile based on deploy mode
    image: marbot-academic-bot-backend:latest
    container_name: marbot-backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WAHA_URL=${WAHA_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - DEBUG_GROUP_ID=${DEBUG_GROUP_ID}
      # Add other env vars as needed
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "3001:3000"
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
    volumes:
      - ./waha/waha_data:/app/.sessions
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped