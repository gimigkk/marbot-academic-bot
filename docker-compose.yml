version: '3.8'

services:
  backend:
    image: marbot-academic-bot-backend:latest
    container_name: marbot-backend  # ← Back to hyphen
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WAHA_URL=${WAHA_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ACADEMIC_CHANNELS=${ACADEMIC_CHANNELS}
      - DEBUG_GROUP_ID=${DEBUG_GROUP_ID}
      - RUST_LOG=${RUST_LOG:-info}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-changeme}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "3001:3000"
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WHATSAPP_HOOK_URL=http://172.17.0.1:3000/webhook
      - WHATSAPP_HOOK_EVENTS=message.any
      - WHATSAPP_HOOK_MEDIA=true
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_WEBHOOK_INCLUDE_QUOTED=true
      - WAHA_PUBLIC_URL=http://43.133.129.209:3001
    volumes:
      - ./waha/waha_data:/app/.sessions
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped