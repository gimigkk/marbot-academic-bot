version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marbot_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ACADEMIC_CHANNELS: ${ACADEMIC_CHANNELS}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3000:3000"
    networks:
      - marbot_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  waha:
    image: devlikeapro/waha:latest
    container_name: marbot_waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_HOOK_URL: http://backend:3000/webhook
      WHATSAPP_HOOK_EVENTS: message.any
    volumes:
      - ./waha/.waha:/app/.waha
    ports:
      - "3001:3000"
    networks:
      - marbot_network

  dozzle:
    image: amir20/dozzle:latest
    container_name: marbot_dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
    environment:
      DOZZLE_NO_ANALYTICS: true
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 500
      DOZZLE_USERNAME: ${DOZZLE_USERNAME:-admin}
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD}
    networks:
      - marbot_network

networks:
  marbot_network:
    driver: bridge